<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="local.css"><link rel="stylesheet" href="local2.css">
<style>
html,body{margin:0;background:transparent}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
.row{position:absolute;left:0;width:1080px;display:flex;justify-content:center;gap:6px}
.ch{display:inline-block;line-height:1;padding:14px 0 22px;filter:drop-shadow(0 6px 7px rgba(30,16,6,.5));transform-origin:50% 60%}
.ch span{display:block}
.sp{width:34px}
</style></head><body><div id="stage"></div>
<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eob=x=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const PAL=[['#ead9ab','#2f1d10'],['#f3ecd6','#7a1f1a'],['#dcc48f','#1c2a5a'],['#5a3b22','#f1e3bd'],['#8e2b1c','#f3e6c4'],['#f3ecd6','#14100c'],['#d3bf8d','#2f1d10'],['#1c2a5a','#f3e6c4']];
const FONTS=[["'EB Garamond'",700],["'Cormorant Garamond'",700],["Inter",900],["'Caveat'",700],["'EB Garamond'",500],["'Cormorant Garamond'",600]];
const rows=[{t:'SOĞAN',y:330,f:1,pd:20},{t:'İSTEDİLER',y:640,f:.8,pd:9}];
const stage=document.getElementById('stage');const items=[];let n=0;
rows.forEach(r=>{
 const row=document.createElement('div');row.className='row';row.style.top=r.y+'px';stage.appendChild(row);
 [...r.t].forEach(c=>{
  const d=document.createElement('div');d.className='ch';
  const [bg,fg]=PAL[Math.floor(rnd()*PAL.length)];const [ff,fw]=FONTS[Math.floor(rnd()*FONTS.length)];
  const sz=((ff==="'Caveat'")?200+rnd()*40:150+rnd()*60)*r.f;d.style.paddingLeft=d.style.paddingRight=r.pd+'px';
  d.style.background=bg;d.style.color=fg;d.style.fontFamily=ff;d.style.fontWeight=fw;d.style.fontSize=sz+'px';
  const rot=(rnd()-.5)*12,dy=(rnd()-.5)*34;
  d.style.clipPath=`polygon(${rnd()*3}% ${rnd()*4}%,100% ${rnd()*4}%,${97+rnd()*3}% 100%,${rnd()*3}% ${96+rnd()*4}%)`;
  d.innerHTML='<span>'+c+'</span>';row.appendChild(d);
  items.push({d,rot,dy,t0:0.15+n*0.07,fx:(rnd()-.5)*500,fy:-700-rnd()*300,fr:(rnd()-.5)*160});n++;
 });
});
function setT(t){
 items.forEach(it=>{
  const p=eob(clamp((t-it.t0)/0.55)),k=1-p;
  const wob=t>it.t0+0.6?Math.sin((t-it.t0)*2.6)*0.5:0;
  it.d.style.opacity=t<it.t0?0:1;
  it.d.style.transform=`translate(${it.fx*k}px,${it.fy*k+it.dy}px) rotate(${it.rot+it.fr*k+wob}deg) scale(${1+0.5*k})`;
 });
}
document.fonts.ready.then(()=>setT(0));
</script></body></html>

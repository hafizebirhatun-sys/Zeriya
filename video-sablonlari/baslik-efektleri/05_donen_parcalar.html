<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="local.css"><link rel="stylesheet" href="local2.css">
<style>
html,body{margin:0;background:transparent}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
.it{position:absolute;left:0;top:0;transform-origin:50% 50%;filter:drop-shadow(0 6px 7px rgba(20,10,3,.55))}
.tag{padding:10px 30px 18px;font-family:"EB Garamond",serif;font-weight:700;font-size:62px;color:#3b2616;white-space:nowrap;
 background:#e8d6a6;clip-path:polygon(0 8%,6% 0,20% 5%,40% 0,62% 5%,82% 0,100% 6%,98% 50%,100% 94%,80% 100%,58% 94%,36% 100%,14% 95%,0 100%,2% 50%)}
.tag.b{background:#dcc48f;color:#1c2a5a}.tag.c{background:#f1e9d2;color:#7a1f1a}
#guide{position:absolute;left:380px;top:640px;width:320px;height:420px;border-radius:50%;background:#56483a;display:none}
</style></head><body><div id="stage"><div id="guide"></div></div>
<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eob=x=>{const c1=1.5,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const onion=`<svg width="130" height="150" viewBox="-50 -60 100 115"><path d="M0-52 C4-40 6-34 8-30 C34-24 46 4 36 28 C28 46 10 52 0 52 C-10 52 -28 46 -36 28 C-46 4 -34-24 -8-30 C-6-34 -4-40 0-52Z" fill="#c98a3c" stroke="#7a4a18" stroke-width="3"/><path d="M-6-28 C-22-6 -22 26 -4 50 M8-28 C26-6 26 26 6 50 M0-30 C-6-6 -6 26 0 50" fill="none" stroke="#7a4a18" stroke-width="2.2" opacity=".75"/><path d="M-6 52 L-12 60 M0 52 L0 62 M6 52 L12 60" stroke="#7a4a18" stroke-width="2.5" stroke-linecap="round"/></svg>`;
const garlic=`<svg width="130" height="150" viewBox="-50 -60 100 115"><path d="M0-50 C3-40 5-34 7-30 C30-26 44-4 36 20 C28 44 8 50 0 50 C-8 50 -28 44 -36 20 C-44-4 -30-26 -7-30 C-5-34 -3-40 0-50Z" fill="#f2ead6" stroke="#9c8c68" stroke-width="3"/><path d="M0-28 C-12 0 -10 30 0 48 M-16-22 C-30 0 -26 28 -14 44 M16-22 C30 0 26 28 14 44" fill="none" stroke="#9c8c68" stroke-width="2.2"/></svg>`;
const star=`<svg width="110" height="110" viewBox="-50 -50 100 100"><path d="M0-44 L12-14 L44-12 L19 8 L27 40 L0 22 L-27 40 L-19 8 L-44-12 L-12-14Z" fill="#c9962a" stroke="#8a6414" stroke-width="3" stroke-linejoin="round"/></svg>`;
const ITEMS=[onion,'<div class="tag">soğan</div>',garlic,'<div class="tag b">sarımsak</div>',star,'<div class="tag c">mercimek</div>',onion];
const st=document.getElementById('stage');
const els=ITEMS.map((h,i)=>{const d=document.createElement('div');d.className='it';d.innerHTML=h;st.appendChild(d);return d});
const CX=540,CY=830,RX=430,RY=150,TILT=-8*Math.PI/180,PERIOD=5;
function setT(t){
 const g=clamp((t-0.1)/0.9),grow=eob(g);
 els.forEach((d,i)=>{
  const a=(i/els.length)*Math.PI*2 + (t/PERIOD)*Math.PI*2;
  let x=Math.cos(a)*RX*grow, y=Math.sin(a)*RY*grow;
  const xr=x*Math.cos(TILT)-y*Math.sin(TILT), yr=x*Math.sin(TILT)+y*Math.cos(TILT);
  const z=Math.sin(a);               // 1 = önde, -1 = arkada
  const sc=(0.78+0.3*z)*grow, w=d.offsetWidth, h=d.offsetHeight;
  d.style.left=(CX+xr-w/2)+'px'; d.style.top=(CY+yr-h/2)+'px';
  d.style.zIndex=Math.round(z*100)+100;
  d.style.opacity=clamp(g*3)*(0.62+0.38*(z+1)/2);
  d.style.transform=`scale(${sc}) rotate(${Math.sin(a*1.0)*7}deg)`;
 });
}
document.fonts.ready.then(()=>setT(0));
</script></body></html>
